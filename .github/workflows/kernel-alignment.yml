name: Kernel adoption alignment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  kernel-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Kernel adoption contract
        run: ./scripts/audit-kernel-alignment.sh
