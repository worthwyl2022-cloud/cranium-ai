name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY to run the production Drizzle migration"
        required: true
        type: string

concurrency:
  group: production-database-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not configured in the production environment." >&2
            exit 1
          fi

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:migrate
