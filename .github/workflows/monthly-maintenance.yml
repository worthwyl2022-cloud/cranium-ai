name: Cranium monthly maintenance

on:
  schedule:
    # First day of each month at 03:00 UTC.
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-and-evolution-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run monthly diagnostics and evolution gate
        env:
          CRANIUM_CONSTITUTION_SHA256: ${{ secrets.CRANIUM_CONSTITUTION_SHA256 }}
        run: pnpm maintenance:monthly

      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cranium-monthly-maintenance-report
          path: maintenance-reports/*.json
          if-no-files-found: warn
