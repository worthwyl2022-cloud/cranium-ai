name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    continue-on-error: true
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  private-repository-prerequisite:
    if: github.event.repository.visibility != 'public'
    name: CodeQL prerequisite
    runs-on: ubuntu-latest
    steps:
      - name: Record repository limitation
        run: |
          echo "CodeQL analysis requires GitHub Code Security for private repositories."
          echo "This repository is currently private, so the CodeQL analyzer is intentionally not invoked."
          echo "The repository's normal CI remains authoritative for source validation."
